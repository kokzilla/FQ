<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Building & Inspection Shield Group with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Center Shield / Card -->
    <rect x="116" y="86" width="280" height="230" rx="28" fill="#ffffff" fill-opacity="0.96" />
    
    <!-- Shield Header Ribbon (Indigo) -->
    <path d="M 116 114 C 116 98.536 128.536 86 144 86 L 368 86 C 383.464 86 396 98.536 396 114 L 396 142 L 116 142 Z" fill="#4338ca" />
    
    <!-- Building Silhouettes in header -->
    <!-- Tower 1 -->
    <rect x="156" y="104" width="24" height="38" rx="2" fill="#e0e7ff" />
    <!-- Tower 2 (Tall Center) -->
    <rect x="188" y="96" width="32" height="46" rx="2" fill="#ffffff" />
    <!-- Tower 3 -->
    <rect x="228" y="108" width="22" height="34" rx="2" fill="#c7d2fe" />
    
    <!-- Checklist items inside the white card -->
    <!-- Line 1 -->
    <circle cx="160" cy="180" r="14" fill="#10b981" />
    <path d="M 154 180 L 158 184 L 167 175" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="190" y="174" width="160" height="12" rx="6" fill="#cbd5e1" />

    <!-- Line 2 -->
    <circle cx="160" cy="220" r="14" fill="#10b981" />
    <path d="M 154 220 L 158 224 L 167 215" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="190" y="214" width="130" height="12" rx="6" fill="#cbd5e1" />

    <!-- Line 3 -->
    <circle cx="160" cy="260" r="14" fill="url(#goldGrad)" />
    <polygon points="160,252 162.5,257.5 168.5,258 164,262 165.5,268 160,264.5 154.5,268 156,262 151.5,258 157.5,257.5" fill="#ffffff" />
    <rect x="190" y="254" width="170" height="12" rx="6" fill="#cbd5e1" />

    <!-- Quality Gold Badge (Floating right) -->
    <circle cx="370" cy="130" r="32" fill="url(#goldGrad)" filter="url(#shadow)" />
    <circle cx="370" cy="130" r="26" fill="#d97706" />
    <path d="M 358 130 L 366 138 L 382 122" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography BRU FQ -->
  <!-- "BRU" in Bold White -->
  <text x="160" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Prompt', sans-serif" font-weight="900" font-size="68" fill="#ffffff" letter-spacing="2">BRU</text>
  
  <!-- "FQ" in Golden Amber Glow -->
  <text x="306" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Prompt', sans-serif" font-weight="900" font-size="68" fill="url(#goldGrad)" letter-spacing="2">FQ</text>

  <!-- Subtitle: FACILITY QUALITY -->
  <rect x="136" y="420" width="240" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" />
  <text x="256" y="439" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Prompt', sans-serif" font-weight="600" font-size="14" fill="#cbd5e1" letter-spacing="4">FACILITY QUALITY</text>
</svg>
