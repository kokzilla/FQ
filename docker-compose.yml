version: '3.8'

services:
  app:
    image: bru-fq-app:latest
    container_name: bru_fq_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    # ช่วยให้เชื่อมต่อไปยัง PostgreSQL ที่รันบน Host เครื่องเดียวกันได้ผ่าน host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

